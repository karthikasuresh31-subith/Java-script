<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user class control</title>
</head>
<body>
    <script>
        class User {
  constructor(name, age, email) {
    this.name = name;
    this.age = age;
    this.email = email;
  }

  getName() {
    return this.name;
  }

  getAge() {
    return this.age;
  }

  setEmail(newEmail) {
    if (newEmail.includes('@')) {
      this.email = newEmail;
      console.log('Email updated successfully!');
    } else {
      console.log('Invalid email format. Update failed.');
    }
  }

  displayUser() {
    console.log(`Name: ${this.name}`);
    console.log(`Age: ${this.age}`);
    console.log(`Email: ${this.email}`);
  }
}

const user1 = new User('john', 25, 'john@example.com');

user1.setEmail('invalidEmail');

user1.setEmail('john.new@example.com');

console.log('\nUser Details:');
console.log(`Name: ${user1.getName()}`);
console.log(`Age: ${user1.getAge()}`);
console.log(`Email: ${user1.email}`);

</script>
    
</body>
</html>
